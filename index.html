 peer.on("open",function(){show("chat");hd();sys("Room "+code+" is ready. Tap the link button to invite friends.")});peer.on("connection",accept);
 peer.on("error",function(e){if(e.type==="unavailable-id"){peer.destroy();startHost(n)}else if(e.type==="network"||e.type==="server-error"||e.type==="socket-error"){show("home");err("Cannot reach the connection service. Check your internet.")}})}
function startGuest(n,c){me=n;host=false;code=c;myId=PFX+code+"-"+gen();peer=new Peer(myId);var to=setTimeout(function(){err("Could not connect. Check the code or your internet.");leave(true)},15000);
 peer.on("connection",accept);
 peer.on("open",function(){var cn=peer.connect(PFX+code,{reliable:true});cn.on("open",function(){clearTimeout(to);show("chat");hd()});wire(cn)});
 peer.on("error",function(e){if(e.type==="peer-unavailable"&&Object.keys(conns).length===0){clearTimeout(to);err("Room not found. Check the code.");leave(true)}})}
function leave(quiet){left=true;Object.keys(conns).forEach(function(k){try{conns[k].c.close()}catch(e){}});try{if(peer)peer.destroy()}catch(e){}conns={};peer=null;reacts={};rxEls={};$("msgs").innerHTML="";$("ty").textContent="";left=false;show("home");if(!quiet)err("")}
$("mk").onclick=function(){err("");var n=name();if(n)startHost(n)};
$("jn").onclick=function(){err("");var n=name();if(!n)return;var c=$("cd").value.trim().toUpperCase();if(c.length!==5){err("The room code has 5 characters.");return}startGuest(n,c)};
$("lv").onclick=function(){leave()};
$("cp").onclick=function(){var url=location.href.split("#")[0]+"#room="+code;if(navigator.share&&/Mobi|Android/i.test(navigator.userAgent)){navigator.share({title:"Two",text:"Join my private chat",url:url}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(url).then(function(){sys("Invite link copied. Send it to your friends.")},function(){sys("Room code: "+code)})}else sys("Room code: "+code)};
$("sd").onclick=sendText;
$("tx").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText()}});
$("tx").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(120,this.scrollHeight)+"px";var n=Date.now();if(n-lastTy>1200){bc({t:"typing"});lastTy=n}});
$("nm").addEventListener("keydown",function(e){if(e.key==="Enter")(hm?$("jn"):$("mk")).click()});$("cd").addEventListener("keydown",function(e){if(e.key==="Enter")$("jn").click()});
})();
